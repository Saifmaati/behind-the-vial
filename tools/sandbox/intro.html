<!doctype html>
<!-- Dev sandbox for js/intro.js + css/intro.css (not shipped). It mounts the exact #intro block from
     index.html, without the rest of the app (no 3D engine in the background), so it is quick to test.
     Serve the repo root (node tools/serve.mjs 8845) and open /tools/sandbox/intro.html
       ?ch=3        jump to a chapter (0 = first, 8 = end card)
       ?rm=1        reduced motion (simple vertical story)       ?theme=dark|light
       ?static=1    do not mount intro.js (what visitors see before it loads, or if it fails)
     Dev handle on the page: document.getElementById('intro').__intro = { go(i, { instant }), state }. -->
<html lang="en" data-intro="show">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sandbox · intro</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/brand.css">
  <link rel="stylesheet" href="/css/intro.css">
  <style>
    .sb-log { position: fixed; left: 12px; top: 12px; z-index: 300; font: 12px/1.4 ui-monospace, monospace; color: #fff; background: rgba(0,0,0,.6); padding: 6px 8px; border-radius: 6px; pointer-events: none; }
    .sb-log:empty { display: none; }
  </style>
  <script>
    (function () {
      var q = new URLSearchParams(location.search), d = document.documentElement;
      var t = q.get('theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      d.setAttribute('data-theme', t);
      if (q.get('rm') === '1') d.setAttribute('data-motion', 'reduce');
      d.classList.add('js');
    })();
  </script>
</head>
<body>
  <div id="intro-slot"></div>

  <main id="app" style="padding: 120px 24px"><h2 id="explorer-title" tabindex="-1">App behind the intro</h2></main>

  <div id="disclaimer" class="disclaimer" role="note" aria-label="Disclaimer">
    <p class="disclaimer-text"><span>Education only</span><span class="sep" aria-hidden="true">·</span><span>Not medical advice</span><span class="sep" aria-hidden="true">·</span><span>No dosing guidance</span><span class="sep" aria-hidden="true">·</span><span>Talk to a trusted adult or a doctor</span></p>
  </div>
  <div class="sb-log" id="sb-log"></div>

  <script type="module">
    const q = new URLSearchParams(location.search);
    const html = document.documentElement;
    const log = (s) => { document.getElementById('sb-log').textContent = s; };
    const bar = document.getElementById('disclaimer');
    html.style.setProperty('--disclaimer-h', `${Math.ceil(bar.getBoundingClientRect().height)}px`);

    // the exact #intro block (and the icon sprite) from index.html, so the sandbox never drifts from the page
    const src = await (await fetch('/index.html', { cache: 'no-store' })).text();
    const doc = new DOMParser().parseFromString(src, 'text/html');
    const sprite = doc.querySelector('svg.sprite');
    if (sprite) document.body.prepend(document.importNode(sprite, true));
    const intro = document.importNode(doc.getElementById('intro'), true);
    // index.html paths are relative to the site root
    for (const n of intro.querySelectorAll('[src], [srcset]')) {
      for (const a of ['src', 'srcset']) {
        const v = n.getAttribute(a);
        if (v) n.setAttribute(a, v.replaceAll('./assets/', '/assets/'));
      }
    }
    document.getElementById('intro-slot').replaceWith(intro);

    if (q.get('static') !== '1') {
      const reducedMotion = html.dataset.motion === 'reduce' || matchMedia('(prefers-reduced-motion: reduce)').matches;
      const { mountIntro } = await import('/js/intro.js');
      let ctl = null;
      const close = (d) => {
        log(`left: ${d?.reason}`);
        html.dataset.intro = 'leaving';
        const finish = () => { html.dataset.intro = 'done'; ctl?.dispose(); window.__disposed = true; };
        if (reducedMotion) finish(); else setTimeout(finish, 450);
      };
      ctl = mountIntro(intro, { reducedMotion, onEnter: close, onFacts: close, onSkip: close });
      window.__ctl = ctl;
      if (q.has('ch')) intro.__intro.go(Number(q.get('ch')), { instant: true });
    }
    window.__ready = true;
  </script>
</body>
</html>
