<!doctype html>
<!-- Dev sandbox for js/intro.js, js/scene/vial.js and js/scene/syringe.js (not shipped).
     Serve the repo root (node tools/serve.mjs 8823) and open /tools/sandbox/intro.html
       ?p=0.35        seek the film to a scroll fraction (0..1) and hold it there
       ?freeze=1      freeze the clock (stills)            ?rm=1   reduced motion (still chapters)
       ?no3d=1        pretend WebGL is unavailable (static still composition)
       ?view=vial     the vial alone under the intro's studio light (&az=20&el=8&dist=0.11&fy=0.02)
       ?view=syringe  the syringe alone (&plunger=0.35&liquid=0.3&cap=1&dist=0.2&az=15&el=8&roll=-38)
     Dev handle on the page: window.__intro (seek(p, { instant }), state). -->
<html lang="en" data-theme="dark" data-intro="show">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sandbox · intro</title>
  <link rel="icon" href="data:,">
  <script type="importmap">
    { "imports": { "three": "/vendor/three/three.module.min.js", "three/addons/": "/vendor/three/addons/" } }
  </script>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/brand.css">
  <link rel="stylesheet" href="/css/intro.css">
  <style>
    .sb-log { position: fixed; left: 12px; bottom: 60px; z-index: 300; font: 12px/1.4 ui-monospace, monospace; color: #E6D3A3; background: rgba(0,0,0,.6); padding: 6px 8px; border-radius: 6px; pointer-events: none; }
    .sb-log:empty { display: none; }
    #product-view { position: fixed; inset: 0; background: #000; }
    #product-view canvas { width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>
  <svg class="sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" style="position:absolute;width:0;height:0">
    <symbol id="i-arrow" viewBox="0 0 24 24">
      <path d="M5 12h13M13 6.5l5.5 5.5-5.5 5.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
  </svg>

  <div id="intro-slot"></div>

  <main id="app" style="padding: 120px 24px"><h2 id="explorer-title" tabindex="-1">App behind the intro</h2></main>

  <div id="disclaimer" class="disclaimer" role="note" aria-label="Disclaimer">
    <p class="disclaimer-text"><span>Education only</span><span class="sep" aria-hidden="true">·</span><span>Not medical advice</span><span class="sep" aria-hidden="true">·</span><span>No dosing guidance</span><span class="sep" aria-hidden="true">·</span><span>Talk to a clinician</span></p>
  </div>
  <div class="sb-log" id="sb-log"></div>

  <script type="module">
    const q = new URLSearchParams(location.search);
    const html = document.documentElement;
    html.classList.add('js');
    const log = (s) => { document.getElementById('sb-log').textContent = s; };
    const bar = document.getElementById('disclaimer');
    html.style.setProperty('--disclaimer-h', `${Math.ceil(bar.getBoundingClientRect().height)}px`);

    if (q.get('view') === 'vial' || q.get('view') === 'syringe') {
      await productView(q.get('view'));
    } else {
      // the exact #intro block from index.html, so the sandbox never drifts from the page
      const src = await (await fetch('/index.html', { cache: 'no-store' })).text();
      const doc = new DOMParser().parseFromString(src, 'text/html');
      const sprite = doc.querySelector('svg.sprite, body > svg');
      if (sprite) document.body.prepend(document.importNode(sprite, true));
      document.getElementById('intro-slot').replaceWith(document.importNode(doc.getElementById('intro'), true));
      const reducedMotion = q.get('rm') === '1' || matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reducedMotion) html.dataset.motion = 'reduce';
      const { mountIntro } = await import('/js/intro.js');
      let ctl = null;
      const close = (kind) => {
        log(`entered: ${kind}`);
        html.dataset.intro = 'leaving';
        const finish = () => { html.dataset.intro = 'done'; ctl?.dispose(); window.__disposed = true; };
        if (reducedMotion) finish(); else setTimeout(finish, 1000);
      };
      ctl = await mountIntro(document.getElementById('intro'), {
        reducedMotion,
        onEnter: (d) => close(d?.reason || 'enter'),
        onFacts: (d) => close(d?.reason || 'facts'),
        debug: {
          p: q.has('p') ? Number(q.get('p')) : undefined,
          freeze: q.get('freeze') === '1',
          quality: q.has('quality') ? Number(q.get('quality')) : undefined,
          no3d: q.get('no3d') === '1',
        },
      });
      window.__ctl = ctl;
      setInterval(() => { const s = ctl?._state; if (s) log(JSON.stringify(s)); }, 500);
    }

    async function productView(kind) {
      const THREE = await import('three');
      const { __dev } = await import('/js/intro.js');
      const host = document.createElement('div');
      host.id = 'product-view';
      document.body.prepend(host);
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
      renderer.setSize(innerWidth, innerHeight);
      renderer.toneMapping = THREE.AgXToneMapping;
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      host.append(renderer.domElement);
      const scene = new THREE.Scene();
      scene.background = new THREE.Color('#' + (q.get('bg') || '0b0a0b'));
      const pmrem = new THREE.PMREMGenerator(renderer);
      const envScene = __dev.buildStudio(THREE);
      scene.environment = pmrem.fromScene(envScene, 0, 0.1, 100, { size: 256 }).texture;
      scene.environmentIntensity = Number(q.get('env') ?? 1);
      __dev.addStudioLights(THREE, scene);
      const camera = new THREE.PerspectiveCamera(Number(q.get('fov') ?? 26), innerWidth / innerHeight, 0.001, 10);
      const pivot = new THREE.Group();
      scene.add(pivot);
      let obj;
      if (kind === 'vial') {
        const { createVial } = await import('/js/scene/vial.js');
        obj = createVial(THREE, {});
        await obj.labelReady;
        pivot.add(obj.group);
        pivot.rotation.y = THREE.MathUtils.degToRad(Number(q.get('spin') ?? 0));
      } else {
        const { createSyringe } = await import('/js/scene/syringe.js');
        obj = createSyringe(THREE, {});
        obj.setPlunger(Number(q.get('plunger') ?? 0.35));
        obj.setLiquid(Number(q.get('liquid') ?? 0.3));
        obj.setCapOn(q.get('cap') === '1');
        obj.setGlow(Number(q.get('glow') ?? 0));
        obj.group.position.y = -Number(q.get('cy') ?? 0.06);
        pivot.rotation.z = THREE.MathUtils.degToRad(Number(q.get('roll') ?? -38));
        pivot.add(obj.group);
      }
      const dist = Number(q.get('dist') ?? (kind === 'vial' ? 0.12 : 0.2));
      const az = THREE.MathUtils.degToRad(Number(q.get('az') ?? 15));
      const el = THREE.MathUtils.degToRad(Number(q.get('el') ?? 8));
      const fy = Number(q.get('fy') ?? (kind === 'vial' ? 0.02 : 0));
      camera.position.set(Math.sin(az) * Math.cos(el) * dist, Math.sin(el) * dist + fy, Math.cos(az) * Math.cos(el) * dist);
      camera.lookAt(0, fy, 0);
      renderer.render(scene, camera);
      renderer.render(scene, camera);
      log(`${kind}: dims ${JSON.stringify(obj.dims).slice(0, 180)}`);
      window.__obj = obj;
    }
  </script>
</body>
</html>
