<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sandbox · timeline + effects</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/timeline.css">
<style>
  /* Sandbox-only page chrome (the real page layout belongs to css/app.css). */
  html { background: var(--bg); }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-sans); -webkit-font-smoothing: antialiased; }
  .sb { max-width: 1320px; margin: 0 auto; padding: 20px 16px 48px; }
  .sb-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 16px; font: 500 12px/1.4 var(--font-sans); color: var(--muted); }
  .sb-bar strong { color: var(--text-2); letter-spacing: .08em; text-transform: uppercase; margin-right: 8px; }
  .sb-bar button { font: inherit; color: var(--text-2); background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 5px 10px; cursor: pointer; }
  .sb-bar button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .sb-grid { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); align-items: start; }
  @media (min-width: 1100px) { .sb-grid { grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr); } }
  .sb-log { margin-top: 16px; font: 12px/1.5 var(--font-code, ui-monospace, monospace); color: var(--muted); white-space: pre-wrap; }
  #sources { margin-top: 32px; color: var(--muted); font-size: 12px; }
  #sources li { margin: 2px 0; }
</style>
</head>
<body>
<main class="sb">
  <div class="sb-bar" aria-label="Sandbox controls">
    <strong>Sandbox · retatrutide entry from data/</strong>
    <button type="button" data-act="done">emit sequence:done</button>
    <button type="button" data-act="null">peptide:loaded (coming soon)</button>
    <button type="button" data-act="entry">peptide:loaded retatrutide</button>
    <button type="button" data-act="weekly">setMode weekly / single</button>
    <button type="button" data-act="motion">toggle reduced motion</button>
    <button type="button" data-act="theme">toggle theme</button>
  </div>
  <div class="sb-grid">
    <div id="timeline"></div>
    <div id="active-effects" aria-live="polite"></div>
  </div>
  <p class="sb-log" id="sb-log" aria-live="off"></p>
  <ol id="sources" aria-label="Sources"></ol>
</main>
<script type="module">
  import { bus } from '/js/bus.js';
  import { mountTimeline } from '/js/timeline.js';
  import { mountEffects } from '/js/effects.js';
  import { SOURCES } from '/data/sources.js';
  import retatrutide from '/data/retatrutide.js';

  const q = new URLSearchParams(location.search);
  if (q.get('theme')) document.documentElement.dataset.theme = q.get('theme');

  const entry = q.get('entry') === 'null' ? null : retatrutide;

  // A numbered source list in the same shape js/ui/sources.js renders (<li id="src-ID" value="n">),
  // so citations in the timeline and the effect cards carry real numbers.
  const ids = [];
  const add = (list) => { for (const id of list || []) if (!ids.includes(id)) ids.push(id); };
  for (const ph of retatrutide.pk?.phases || []) add(ph.sources);
  for (const st of retatrutide.absorption?.steps || []) add(st.sources);
  for (const fx of retatrutide.sideEffects || []) { add(fx.frequency?.sources); add(fx.why?.sources); add(fx.reduce?.sources); }
  document.getElementById('sources').innerHTML = ids.map((id, i) =>
    `<li id="src-${id}" value="${i + 1}">${(SOURCES[id]?.title || id).replace(/[<&]/g, (c) => (c === '<' ? '&lt;' : '&amp;'))}</li>`).join('');

  let reducedMotion = q.get('rm') === '1' || matchMedia('(prefers-reduced-motion: reduce)').matches;
  const events = { time: [], effects: [], focus: [] };
  const log = document.getElementById('sb-log');
  bus.on('time:change', (d) => {
    events.time.push(d); if (events.time.length > 50) events.time.shift();
    log.textContent = `time:change ${JSON.stringify({ tDays: +d.tDays.toFixed(3), level: +d.level.toFixed(3), phaseId: d.phaseId, phaseLabel: d.phaseLabel, mode: d.mode, estimate: d.estimate })}`;
  });
  bus.on('effects:active', (d) => events.effects.push(d));
  bus.on('organ:focus', (d) => events.focus.push(d));
  window.__events = events;
  window.__bus = bus;

  const fx = mountEffects(document.getElementById('active-effects'), entry);
  const tl = mountTimeline(document.getElementById('timeline'), entry, { reducedMotion });
  window.__tl = tl; window.__fx = fx;
  if (q.get('mode')) tl.setMode(q.get('mode'));
  if (q.get('t')) tl.set(Number(q.get('t')));
  if (q.get('cue')) bus.emit('sequence:done', {});

  document.querySelector('.sb-bar').addEventListener('click', (e) => {
    const act = e.target.closest('button')?.dataset.act;
    if (act === 'done') bus.emit('sequence:done', {});
    if (act === 'null') bus.emit('peptide:loaded', { id: 'semaglutide', entry: null });
    if (act === 'entry') bus.emit('peptide:loaded', { id: 'retatrutide', entry: retatrutide });
    if (act === 'weekly') tl.setMode(tl.mode === 'weekly' ? 'single' : 'weekly');
    if (act === 'motion') { reducedMotion = !reducedMotion; bus.emit('motion:change', { reducedMotion }); }
    if (act === 'theme') {
      const root = document.documentElement;
      const dark = root.dataset.theme ? root.dataset.theme === 'dark' : !matchMedia('(prefers-color-scheme: light)').matches;
      root.dataset.theme = dark ? 'light' : 'dark';
    }
  });
</script>
</body>
</html>
