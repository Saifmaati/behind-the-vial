<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>Body3D Sandbox</title>
<!-- Dev-only harness for js/scene/* (body). Simulates the bus: sites, sequence, time, effects, risk, focus, theme.
     Query: ?anatomy=procedural|auto  ?theme=light|dark  ?site=abdomen|thigh|arm  ?rm=1 (reduced motion)
            ?speed=N (scales scene time; headless SwiftShader renders at a few fps and dt is clamped)
            ?assets=/tools/.cache/body3d-glbtest/ (load body.glb + landmarks.json from another folder)
            Editable body (appearance only): ?sex=male|female&h=<cm>&w=<kg>&age=<years>&tone=tone-1..6 (applied before mount),
            and the "Body" button in the stage.
            Lifelike view (v3): ?xray=0..1 (0 lifelike, 1 glass)  ?detail=<detail glb path>  ?atlas=<atlas json path>
            ?quality=high|low  ?poster=1 (hides the harness bars for the fallback still and the intro stills)
            ?nodetail=1 (never fetch the detail model)  -->
<script type="importmap">
{ "imports": { "three": "/vendor/three/three.module.min.js", "three/addons/": "/vendor/three/addons/" } }
</script>
<script>
  (function () {
    var q = new URLSearchParams(location.search);
    var t = q.get('theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.dataset.theme = t;
    if (q.get('rm') === '1') document.documentElement.dataset.motion = 'reduce';
    if (q.get('poster') === '1') document.documentElement.classList.add('poster');
  })();
</script>
<link rel="stylesheet" href="/css/stage.css">
<style>
  html { --sb-bg: #f7f6fb; --sb-text: #17142b; --sb-muted: #5b5873; --sb-line: #e4e1f0; --sb-surface: #fff; }
  html[data-theme="dark"] { --sb-bg: #0f0e17; --sb-text: #f3f2fa; --sb-muted: #a9a6c4; --sb-line: #2c2a45; --sb-surface: #17162a; }
  html, body { margin: 0; background: var(--sb-bg); color: var(--sb-text); font-family: system-ui, sans-serif; }
  .sb { display: grid; gap: 10px; padding: 12px 16px 16px; max-width: 1180px; margin: 0 auto; }
  .sb-bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 0.8rem; }
  .sb-bar b { font-weight: 700; color: var(--sb-muted); margin-right: 4px; font-size: 0.74rem; }
  .sb-bar button { font: inherit; padding: 6px 10px; border-radius: 999px; border: 1px solid var(--sb-line); background: var(--sb-surface); color: var(--sb-text); cursor: pointer; }
  .sb-bar button[aria-pressed="true"] { border-color: #6246ea; color: #6246ea; }
  .sb-bar input[type=range] { width: 200px; }
  .sb-log { font: 0.74rem/1.4 ui-monospace, monospace; color: var(--sb-muted); min-height: 1.4em; }
  #stage-host { position: relative; height: min(76vh, 760px); border-radius: 24px; overflow: hidden; border: 1px solid var(--sb-line); container-type: inline-size; container-name: stage; }
  #stage-canvas-host, #callout-layer { position: absolute; inset: 0; }
  #callout-layer { pointer-events: none; }
  html.poster .sb-bar, html.poster .sb-log { display: none; }
  html.poster .sb { padding: 0; max-width: none; }
  html.poster #stage-host { height: 100vh; border-radius: 0; border: 0; }
  html.poster .stage-tools, html.poster .stage-panel-btns, html.poster .stage-hint, html.poster .stage-credit, html.poster .stage-legend, html.poster #callout-layer { display: none !important; }
  @media (max-width: 600px) { .sb { padding: 8px 12px 12px; } #stage-host { height: 62vh; } .sb-bar button { padding: 5px 8px; } }
</style>
</head>
<body>
<div class="sb">
  <div class="sb-bar" id="bar-sites"><b>Site</b>
    <button data-site="abdomen">Abdomen</button><button data-site="thigh">Thigh</button><button data-site="arm">Upper arm</button>
    <button id="inject">Inject</button><button id="skip">Skip</button>
    <button id="theme">Theme</button>
    <button id="stats">Stats</button>
  </div>
  <div class="sb-bar"><b>Body (test)</b>
    <button data-body='{"sex":"male","heightCm":175,"weightKg":75,"age":35}'>Default</button>
    <button data-body='{"sex":"male","heightCm":198,"weightKg":140,"age":40}'>Tall / heavy</button>
    <button data-body='{"sex":"male","heightCm":152,"weightKg":46,"age":24}'>Short / light</button>
    <button data-body='{"sex":"male","heightCm":175,"weightKg":75,"age":84}'>Older</button>
    <button data-body='{"sex":"female","heightCm":162,"weightKg":65,"age":35}'>Female</button>
  </div>
  <div class="sb-bar"><b>View (test)</b>
    <button data-view='{"xray":0}'>Lifelike</button>
    <button data-view='{"xray":0.5}'>Half</button>
    <button data-view='{"xray":1}'>Glass</button>
    <button data-view='{"layers":{"skin":false,"organs":true,"vessels":true,"skeleton":true}}'>No skin</button>
    <button data-view='{"layers":{"skin":true,"organs":true,"vessels":true,"skeleton":true}}'>All layers</button>
    <button data-view='{"layers":{"skin":true,"organs":true,"vessels":true,"skeleton":false}}'>Default layers</button>
  </div>
  <div class="sb-bar"><b>Time (test)</b><input id="time" type="range" min="0" max="22" step="0.05" value="0" aria-label="Time since injection, days (test harness)"><span id="time-out">0 d</span>
    <button id="fx">Effects</button><button id="risk">Risk</button><button id="focus">Focus liver</button><button id="clear">Clear</button>
  </div>
  <div id="stage-host" class="stage-host" data-state="loading" role="region" aria-label="3D body view">
    <div id="stage-canvas-host" class="stage-canvas-host"></div>
    <div class="stage-hud" aria-hidden="true">
      <span class="hud-corner hud-corner--tl"></span><span class="hud-corner hud-corner--tr"></span>
      <span class="hud-corner hud-corner--bl"></span><span class="hud-corner hud-corner--br"></span>
      <span class="hud-ruler hud-ruler--y"></span><span class="hud-ruler hud-ruler--x"></span>
      <span class="hud-label hud-label--tl"><span class="hud-tl-kind">Anatomical model · </span>Visible Human Male · 1.75 m</span>
      <span class="hud-label hud-label--tr"><span class="hud-dot"></span><span id="hud-phase">Standby</span></span>
      <span class="hud-label hud-label--bl" id="hud-hint">Drag to rotate · Scroll to zoom</span>
      <span class="hud-label hud-label--br">Site <span id="hud-site">not set</span></span>
    </div>
    <div id="callout-layer" class="callout-layer"></div>
    <div id="stage-loading" class="stage-loading" role="status" style="position:absolute;left:16px;top:16px"><span class="stage-loading-text">Preparing the 3D body…</span></div>
    <div id="stage-fallback" class="stage-fallback" hidden><div class="stage-fallback-inner"><p class="stage-fallback-title">The 3D view isn’t available here</p></div></div>
  </div>
  <div class="sb-log" id="log" aria-live="polite"></div>
</div>
<script type="module">
  import { bus } from '/js/bus.js';
  import { mountBody } from '/js/scene/index.js';
  const q = new URLSearchParams(location.search);
  const html = document.documentElement;
  const $ = (s) => document.querySelector(s);
  const log = (m) => { $('#log').textContent = m; };
  const host = $('#stage-host');
  let entry = null;
  try { entry = (await import('/data/retatrutide.js')).default; } catch (e) { console.warn('no data', e); }
  // a body set before the scene mounts is replayed by mountBody (bus.last)
  if (q.get('sex') || q.get('h') || q.get('w') || q.get('age') || q.get('tone')) {
    bus.emit('body:change', { sex: q.get('sex') || 'male', heightCm: Number(q.get('h')) || undefined, weightKg: Number(q.get('w')) || undefined, age: Number(q.get('age')) || undefined, skinTone: q.get('tone') || undefined });
  }
  const t0 = performance.now();
  const body = await mountBody(host, {
    bus, theme: html.dataset.theme, reducedMotion: html.dataset.motion === 'reduce' || matchMedia('(prefers-reduced-motion: reduce)').matches,
    anatomy: q.get('anatomy') || 'auto', assetBase: q.get('assets') || undefined, creditHref: '/ASSETS.md',
    detail: q.get('nodetail') === '1' ? false : q.get('detail') || q.get('atlas') ? { glb: q.get('detail') || undefined, atlas: q.get('atlas') || undefined } : undefined,
    quality: q.get('quality') || undefined,
  });
  // the view as a visitor would set it in the Layers panel (sync the panel too)
  const setView = (v) => {
    const cur = body.view;
    const next = { layers: { ...cur.layers, ...(v.layers || {}) }, xray: Number.isFinite(v.xray) ? v.xray : cur.xray };
    body.layers.sync(next);
    body.layers.elements.slider.dispatchEvent(new Event('change'));
  };
  // work per frame: draw calls, triangles and point sprites for one frame, and whether the loop is idle
  const stats = () => {
    const st = body.stage, r = st.renderer;
    r.info.autoReset = false; r.info.reset();
    st.renderOnce();
    const out = { calls: r.info.render.calls, triangles: r.info.render.triangles, points: r.info.render.points, programs: r.info.programs?.length,
      pixelRatio: r.getPixelRatio(), running: st.running, frames: st.stats.frames, particles: body.vessels.particleCount };
    r.info.autoReset = true;
    return out;
  };
  $('#stats').addEventListener('click', () => log(JSON.stringify(stats())));
  if (q.get('xray') != null) setView({ xray: Number(q.get('xray')) });
  if (q.get('speed')) body.stage.timeScale = Number(q.get('speed')) || 1;
  host.dataset.state = 'ready';
  $('#stage-loading').hidden = true;
  const mountMs = Math.round(performance.now() - t0);
  bus.emit('peptide:loaded', { id: entry?.id || 'retatrutide', entry });

  bus.on('sequence:phase', (d) => { $('#hud-phase').textContent = d.label; host.dataset.phase = d.phase === 'done' ? '' : d.phase; log(`phase ${d.phase}: ${d.label}`); window.__phases.push(d.phase); });
  bus.on('sequence:done', () => { window.__done = true; });
  bus.on('site:select', ({ site }) => {
    $('#hud-site').textContent = site;
    for (const b of document.querySelectorAll('[data-site]')) b.setAttribute('aria-pressed', String(b.dataset.site === site));
  });
  bus.on('organ:focus', ({ organ }) => log(`organ:focus ${organ}`));
  window.__phases = [];

  for (const b of document.querySelectorAll('[data-site]')) b.addEventListener('click', () => bus.emit('site:select', { site: b.dataset.site }));
  let site = q.get('site');
  bus.on('site:select', (d) => { site = d.site; });
  for (const b of document.querySelectorAll('[data-body]')) b.addEventListener('click', () => bus.emit('body:change', JSON.parse(b.dataset.body)));
  for (const b of document.querySelectorAll('[data-view]')) b.addEventListener('click', () => setView(JSON.parse(b.dataset.view)));
  $('#inject').addEventListener('click', () => bus.emit('sequence:start', { site: site || 'abdomen', peptideId: entry?.id }));
  $('#skip').addEventListener('click', () => body.injection.skip());
  $('#theme').addEventListener('click', () => {
    const t = html.dataset.theme === 'dark' ? 'light' : 'dark';
    html.dataset.theme = t;
    bus.emit('theme:change', { theme: t });
  });
  // simple one-shot curve for the harness (normalized, peak = 1)
  const hl = entry?.pk?.halfLifeDays || 6, tmax = entry?.pk?.tmaxDays || 1.1;
  const ke = Math.log(2) / hl;
  let ka = 3; for (let i = 0; i < 60; i++) { const f = Math.log(ka / ke) / (ka - ke); ka *= f > tmax ? 1.08 : 0.94; }
  const raw = (t) => (Math.exp(-ke * t) - Math.exp(-ka * t));
  let peak = 0; for (let t = 0; t < 10; t += 0.01) peak = Math.max(peak, raw(t));
  function setTime(t) {
    const level = Math.max(0, raw(t) / peak);
    $('#time').value = t; $('#time-out').textContent = `${t.toFixed(1)} d · ${Math.round(level * 100)}%`;
    bus.emit('time:change', { tDays: t, level, mode: 'single' });
    if (entry?.sideEffects) {
      const items = entry.sideEffects.filter((s) => t >= s.timing.fromDays && t <= s.timing.toDays)
        .map((x) => ({ id: x.id, organ: x.organ, severity: x.severity, name: x.name, alsoOrgans: x.alsoOrgans || [] }));
      bus.emit('effects:active', { ids: items.map((x) => x.id), items });
    }
  }
  $('#time').addEventListener('input', (e) => setTime(Number(e.target.value)));
  let fxOn = false, riskOn = false;
  $('#fx').addEventListener('click', () => {
    fxOn = !fxOn;
    const items = fxOn && entry ? entry.sideEffects.filter((s) => ['nausea', 'pancreatitis', 'heart-rate', 'injection-site', 'gallbladder'].includes(s.id))
      .map((x) => ({ id: x.id, organ: x.organ, severity: x.severity, name: x.name, alsoOrgans: x.alsoOrgans || [] })) : [];
    bus.emit('effects:active', { ids: items.map((x) => x.id), items });
  });
  $('#risk').addEventListener('click', () => {
    riskOn = !riskOn;
    const ids = riskOn ? ['heart-rhythm', 'thyroid-mtc', 'pancreatitis'] : [];
    const warnings = ids.flatMap((id) => (entry?.risk?.[id] || []).map((w) => ({ organ: w.organ, title: w.title, item: id })));
    bus.emit('risk:change', { items: ids, warnings });
  });
  $('#focus').addEventListener('click', () => bus.emit('organ:focus', { organ: 'liver' }));
  $('#clear').addEventListener('click', () => {
    bus.emit('effects:active', { ids: [], items: [] }); bus.emit('risk:change', { items: [], warnings: [] });
    body.stage.homeView();
  });
  window.__sb = { bus, body, entry, setTime, mountMs, setView, stats, emit: (t, d) => bus.emit(t, d) };
  if (site) bus.emit('site:select', { site });
  html.classList.add('sb-ready');
  log(`ready · anatomy: ${body.anatomy.source} · mount ${mountMs} ms`);
</script>
</body>
</html>
